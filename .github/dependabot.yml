version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # pydantic pins pydantic-core exactly; a lone pydantic-core bump breaks `pip check`.
      # It is updated together with pydantic.
      - dependency-name: pydantic-core
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Workflow actions are pinned to commit SHAs; one grouped PR updates them together.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
