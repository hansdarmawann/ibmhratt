name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  # Weekly run: new advisories can affect unchanged dependencies and base images. Never publishes.
  schedule:
    - cron: '0 3 * * 1'

# Third-party actions and tools are pinned to commit SHAs or image digests; Dependabot proposes updates.
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-serving.txt
            requirements-dev.txt
            requirements-explain.txt
            requirements-lock.txt
      - name: Install constrained dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-explain.txt -c requirements-lock.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Lint
        run: python -m ruff check . --output-format=github
      - name: Type check
        run: python -m mypy
      - name: Run unit and integration tests with coverage
        run: >-
          python -m pytest -q --junitxml=reports/test-results.xml
          --cov --cov-report=term --cov-fail-under=0
      - name: Train from the canonical raw dataset
        run: python -m coverage run --append -m attrition.models.train --with-shap
      - name: Enforce combined test and training coverage
        run: |
          python -m coverage report --fail-under=80
          python -m coverage xml -o reports/coverage.xml
      - name: Check committed results match a fresh run
        shell: bash
        run: |
          if ! git diff --exit-code -- README.md reports/results.md; then
            echo "::error::Training changed README.md or reports/results.md. Retrain locally and commit the regenerated results."
            exit 1
          fi
      - name: Check committed metrics and figures match a fresh run
        run: python -m scripts.compare_reports
      - name: Execute all notebooks
        run: python -m scripts.execute_notebooks
      - name: Verify artifacts and live services
        run: python -m scripts.verify_delivery
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
          path: |
            reports/
            models/*.joblib
            models/*.json
            models/runs/
            data/processed/*.csv
            notebooks/*.ipynb

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit every locked package for known vulnerabilities
        # The lock pins every package exactly, so no resolution or installation is needed.
        run: python -m pip_audit -r requirements-lock.txt --no-deps --disable-pip --progress-spinner off

  container:
    name: Test container and deliver to GHCR
    needs: [validate, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
      - name: Build the image for local validation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: attrition-ci:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test container health, prediction, and runtime contents
        run: python -m scripts.verify_container --image attrition-ci:local
      - name: Scan the image for fixable high and critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          attrition-ci:local
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.event.repository.fork == false
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name == 'push' && github.event.repository.fork == false
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker tag attrition-ci:local "$tag"
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
