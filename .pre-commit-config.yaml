# Optional local hooks: pip install pre-commit && pre-commit install
# Ruff and mypy run from the activated ibmhratt environment, so they use the
# versions pinned in requirements-lock.txt rather than separate hook copies.
# Generated training outputs are excluded; CI checks them against a fresh run.
exclude: ^(reports|notebooks|data)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
