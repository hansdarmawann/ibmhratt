# Tool configuration only. Dependencies live in the requirements files and
# requirements-lock.txt so pip, Conda, Docker, and CI share one source.

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Intentional late imports: sys.path setup for Streamlit, matplotlib backend selection.
"app/streamlit_app.py" = ["E402"]
"src/visualization/plots.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src", "app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
